
name: Build CS Dust2 Mobile APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'project-source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: |
          unzip -o project-source.zip -d extracted
          ROOT=$(find extracted -type f -name settings.gradle -printf '%h\n' | head -1)
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle -p "$PROJECT_ROOT" assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CS-Dust2-Mobile-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
