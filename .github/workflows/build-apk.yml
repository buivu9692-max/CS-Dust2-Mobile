name: Build CS Dust2 Mobile APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract project
        run: |
          ls -la
          unzip -o project-source.zip -d extracted

      - name: Build APK
        run: |
          cd extracted
          find . -name gradlew -exec chmod +x {} \;
          if [ -f gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CS-Dust2-APK
          path: extracted/**/build/outputs/apk/**/*.apk
